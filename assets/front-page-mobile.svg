<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 360 1400.52" width="360" height="1400.52" role="img" aria-label="The Daily Royston — COMMITS SURGE 100% AS WORK ON RAOMLY ACCELERATES">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .04"/></feComponentTransfer>
    </filter>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity=".3"/></filter>
  </defs>
  <style>
    text { fill: #1b1a17; }
    .mast { font: 700 34px Georgia, 'Times New Roman', Times, serif; letter-spacing: -1px; }
    .motto { font: italic 400 15px Georgia, 'Times New Roman', Times, serif; fill: #5e5a51; }
    .edition { font: 700 12px Georgia, 'Times New Roman', Times, serif; letter-spacing: 1.2px; }
    .head { font: 700 25px Georgia, 'Times New Roman', Times, serif; letter-spacing: -.3px; }
    .deck { font: italic 400 16px Georgia, 'Times New Roman', Times, serif; fill: #34312b; }
    .byline { font: italic 400 14px Georgia, 'Times New Roman', Times, serif; fill: #5e5a51; }
    .body { font: 400 15px Georgia, 'Times New Roman', Times, serif; }
    .dropcap { font-weight: 700; font-family: Georgia, 'Times New Roman', Times, serif; }
    .section { font: 700 16px Georgia, 'Times New Roman', Times, serif; }
    .note { font: italic 400 13px Georgia, 'Times New Roman', Times, serif; fill: #5e5a51; }
    .row { font: 400 15px Georgia, 'Times New Roman', Times, serif; }
    .num { font-weight: 700; font-variant-numeric: tabular-nums; }
    .side { font: 400 14px Georgia, 'Times New Roman', Times, serif; fill: #2b2924; }
    .repo { font: 700 18px Georgia, 'Times New Roman', Times, serif; }
    .meta { font: 400 13px Georgia, 'Times New Roman', Times, serif; fill: #5e5a51; }
    .tick { font: 700 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f5f0e4; letter-spacing: .4px; }
    .ticker { animation: tick linear infinite; }
    @keyframes tick { to { transform: translateX(-806px); } }
    .live { animation: live 1.6s ease-in-out infinite; }
    @keyframes live { 50% { opacity: .15; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="340" height="1380.52" fill="#f5f0e4" filter="url(#shadow)"/>
  <rect width="340" height="1380.52" filter="url(#grain)"/>
  <text x="170" y="44.519999999999996" class="mast" text-anchor="middle" textLength="304" lengthAdjust="spacingAndGlyphs">The Daily Royston</text>
  <text x="170" y="70.52" class="motto" text-anchor="middle">“All the code that’s fit to ship.”</text>
  <rect x="18" y="88.52" width="304" height="1" fill="#1b1a17"/>
  <text x="170" y="108.52" class="edition" text-anchor="middle">OCT 28, 2026  ·  VOL. V  ·  NO. 1,461</text>
  <rect x="18" y="118.52" width="304" height="3" fill="#1b1a17"/><rect x="18" y="123.52" width="304" height="1" fill="#1b1a17"/>
  <text x="18" y="165.51999999999998" class="head">COMMITS SURGE 100%</text>
  <text x="18" y="195.51999999999998" class="head">AS WORK ON RAOMLY</text>
  <text x="18" y="225.51999999999998" class="head">ACCELERATES</text>
  <text x="18" y="255.51999999999998" class="deck">Latest dispatch from Raomly reads “Add</text>
  <text x="18" y="277.52" class="deck">Android polish: insets, sheet grabber,</text>
  <text x="18" y="299.52" class="deck">tab colors, edge to edge fixes”.</text>
  <text x="18" y="321.52" class="deck">Colleagues describe the change as “long</text>
  <text x="18" y="343.52" class="deck">overdue.”</text>
  <rect x="18" y="373.52" width="304" height="1" fill="#1b1a17" opacity=".3"/>
  <text x="18" y="403.52" class="byline">By our GitHub correspondent  ·  28 Oct, 06:08 UTC</text>
  <text x="16" y="480.52" class="dropcap" style="font-size:81px">R</text>
  <text x="88" y="434.52" class="body">oyston Akash Dsouza, the</text>
  <text x="88" y="457.52" class="body">full-stack developer behind</text>
  <text x="88" y="480.52" class="body">Raomly, Lisi-re-Luxury and</text>
  <text x="18" y="503.52" class="body">mcp-server, logged 10 commits this week</text>
  <text x="18" y="526.52" class="body">across 2 repositories.</text>
  <text x="18" y="555.52" class="body">When reached for comment, Dsouza said</text>
  <text x="18" y="578.52" class="body">only that the project was “one more</text>
  <text x="18" y="601.52" class="body">refactor away” from done. Readers hoping</text>
  <text x="18" y="624.52" class="body">to collaborate are directed to the</text>
  <text x="18" y="647.52" class="body">classifieds.</text>
  <rect x="18" y="674.52" width="304" height="1" fill="#1b1a17" opacity=".3"/>
  <text x="18" y="698.52" class="section">Markets</text>
  <text x="322" y="698.52" class="note" text-anchor="end">share · vs last wk</text>
  <text x="18" y="726.52" class="row">TypeScript</text>
  <text x="256" y="726.52" class="row num" text-anchor="end">100%</text>
  <text x="322" y="726.52" class="row num" text-anchor="end" fill="#1e6b3a">▲ 100</text>
  <rect x="18" y="758.52" width="304" height="1" fill="#1b1a17" opacity=".3"/>
  <text x="18" y="782.52" class="section">Forecast</text>
  <text x="18" y="808.52" class="side">100% chance of TypeScript. Clear skies</text>
  <text x="18" y="829.52" class="side">through the weekend.</text>
  <rect x="18" y="856.52" width="304" height="1" fill="#1b1a17" opacity=".3"/>
  <text x="18" y="880.52" class="section">Classifieds</text>
  <text x="18" y="906.52" class="side">Wanted: interesting problems and ambitious</text>
  <text x="18" y="927.52" class="side">teams. Write to roystonad2004@gmail.com.</text>
  <rect x="18" y="962.52" width="304" height="1" fill="#1b1a17" opacity=".3"/>
  <text x="18" y="986.52" class="section">On the workbench</text>
  <text x="18" y="1018.52" class="repo">Raomly</text>
  <circle cx="22" cy="1036.52" r="4" fill="#3178c6"/>
  <text x="32" y="1041.52" class="meta">TypeScript  ·  yesterday</text>
  <text x="18" y="1064.52" class="side">No description on file. Our reporters are</text>
  <text x="18" y="1085.52" class="side">investigating.</text>
  <text x="18" y="1132.52" class="repo">Lisi-re-Luxury</text>
  <circle cx="22" cy="1150.52" r="4" fill="#3178c6"/>
  <text x="32" y="1155.52" class="meta">TypeScript  ·  5 days ago</text>
  <text x="18" y="1178.52" class="side">Lisière-Luxury built using the capabilities</text>
  <text x="18" y="1199.52" class="side">of agentic ai </text>
  <text x="18" y="1246.52" class="repo">mcp-server</text>
  <circle cx="22" cy="1264.52" r="4" fill="#3572a5"/>
  <text x="32" y="1269.52" class="meta">Python  ·  7 days ago</text>
  <text x="18" y="1292.52" class="side">No description on file. Our reporters are</text>
  <text x="18" y="1313.52" class="side">investigating.</text>
  <rect x="0" y="1346.52" width="340" height="34" fill="#1b1a17"/>
  <svg x="0" y="1346.52" width="340" height="34"><g class="ticker" style="animation-duration:20s">
    <text x="0" y="22" class="tick" xml:space="preserve">COMMITS THIS WEEK 10 ▲ 100%    ◆    PUBLIC REPOS 64    ◆    STARS ★ 13    ◆    FOLLOWERS 18    ◆    </text>
    <text x="806" y="22" class="tick" xml:space="preserve">COMMITS THIS WEEK 10 ▲ 100%    ◆    PUBLIC REPOS 64    ◆    STARS ★ 13    ◆    FOLLOWERS 18    ◆    </text>
  </g></svg>
</svg>
