<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 360 1423.52" width="360" height="1423.52" role="img" aria-label="The Daily Royston — DEVELOPER SPOTTED SHIPPING 5 COMMITs TO RAOMLY">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .04"/></feComponentTransfer>
    </filter>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity=".3"/></filter>
  </defs>
  <style>
    text { fill: #1b1a17; }
    .mast { font: 700 34px Georgia, 'Times New Roman', Times, serif; letter-spacing: -1px; }
    .motto { font: italic 400 15px Georgia, 'Times New Roman', Times, serif; fill: #5e5a51; }
    .edition { font: 700 12px Georgia, 'Times New Roman', Times, serif; letter-spacing: 1.2px; }
    .head { font: 700 25px Georgia, 'Times New Roman', Times, serif; letter-spacing: -.3px; }
    .deck { font: italic 400 16px Georgia, 'Times New Roman', Times, serif; fill: #34312b; }
    .byline { font: italic 400 14px Georgia, 'Times New Roman', Times, serif; fill: #5e5a51; }
    .body { font: 400 15px Georgia, 'Times New Roman', Times, serif; }
    .dropcap { font-weight: 700; font-family: Georgia, 'Times New Roman', Times, serif; }
    .section { font: 700 16px Georgia, 'Times New Roman', Times, serif; }
    .note { font: italic 400 13px Georgia, 'Times New Roman', Times, serif; fill: #5e5a51; }
    .row { font: 400 15px Georgia, 'Times New Roman', Times, serif; }
    .num { font-weight: 700; font-variant-numeric: tabular-nums; }
    .side { font: 400 14px Georgia, 'Times New Roman', Times, serif; fill: #2b2924; }
    .repo { font: 700 18px Georgia, 'Times New Roman', Times, serif; }
    .meta { font: 400 13px Georgia, 'Times New Roman', Times, serif; fill: #5e5a51; }
    .tick { font: 700 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f5f0e4; letter-spacing: .4px; }
    .ticker { animation: tick linear infinite; }
    @keyframes tick { to { transform: translateX(-790px); } }
    .live { animation: live 1.6s ease-in-out infinite; }
    @keyframes live { 50% { opacity: .15; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="340" height="1403.52" fill="#f5f0e4" filter="url(#shadow)"/>
  <rect width="340" height="1403.52" filter="url(#grain)"/>
  <text x="170" y="44.519999999999996" class="mast" text-anchor="middle" textLength="304" lengthAdjust="spacingAndGlyphs">The Daily Royston</text>
  <text x="170" y="70.52" class="motto" text-anchor="middle">“All the code that’s fit to ship.”</text>
  <rect x="18" y="88.52" width="304" height="1" fill="#1b1a17"/>
  <text x="170" y="108.52" class="edition" text-anchor="middle">OCT 30, 2026  ·  VOL. V  ·  NO. 1,463</text>
  <rect x="18" y="118.52" width="304" height="3" fill="#1b1a17"/><rect x="18" y="123.52" width="304" height="1" fill="#1b1a17"/>
  <text x="18" y="165.51999999999998" class="head">DEVELOPER SPOTTED</text>
  <text x="18" y="195.51999999999998" class="head">SHIPPING 5 COMMITs</text>
  <text x="18" y="225.51999999999998" class="head">TO RAOMLY</text>
  <text x="18" y="255.51999999999998" class="deck">Latest dispatch from</text>
  <text x="18" y="277.52" class="deck">roystonakashdsouza.in reads “Merge pull</text>
  <text x="18" y="299.52" class="deck">request #1 from roystondz/redesign-v4”.</text>
  <text x="18" y="321.52" class="deck">Sources close to the developer call it “a</text>
  <text x="18" y="343.52" class="deck">step in the right direction.”</text>
  <rect x="18" y="373.52" width="304" height="1" fill="#1b1a17" opacity=".3"/>
  <text x="18" y="403.52" class="byline">By our GitHub correspondent  ·  30 Oct, 06:18 UTC</text>
  <text x="16" y="480.52" class="dropcap" style="font-size:81px">R</text>
  <text x="88" y="434.52" class="body">oyston Akash Dsouza, the</text>
  <text x="88" y="457.52" class="body">full-stack developer behind</text>
  <text x="88" y="480.52" class="body">roystonakashdsouza.in, Raomly</text>
  <text x="18" y="503.52" class="body">and Lisi-re-Luxury, logged 7 commits</text>
  <text x="18" y="526.52" class="body">this week across 2 repositories, down</text>
  <text x="18" y="549.52" class="body">22% on the week before.</text>
  <text x="18" y="578.52" class="body">When reached for comment, Dsouza said</text>
  <text x="18" y="601.52" class="body">only that the project was “one more</text>
  <text x="18" y="624.52" class="body">refactor away” from done. Readers hoping</text>
  <text x="18" y="647.52" class="body">to collaborate are directed to the</text>
  <text x="18" y="670.52" class="body">classifieds.</text>
  <rect x="18" y="697.52" width="304" height="1" fill="#1b1a17" opacity=".3"/>
  <text x="18" y="721.52" class="section">Markets</text>
  <text x="322" y="721.52" class="note" text-anchor="end">share · vs last wk</text>
  <text x="18" y="749.52" class="row">TypeScript</text>
  <text x="256" y="749.52" class="row num" text-anchor="end">100%</text>
  <text x="322" y="749.52" class="row num" text-anchor="end" fill="#1e6b3a">▲ 44</text>
  <rect x="18" y="781.52" width="304" height="1" fill="#1b1a17" opacity=".3"/>
  <text x="18" y="805.52" class="section">Forecast</text>
  <text x="18" y="831.52" class="side">100% chance of TypeScript. Clear skies</text>
  <text x="18" y="852.52" class="side">through the weekend.</text>
  <rect x="18" y="879.52" width="304" height="1" fill="#1b1a17" opacity=".3"/>
  <text x="18" y="903.52" class="section">Classifieds</text>
  <text x="18" y="929.52" class="side">Wanted: interesting problems and ambitious</text>
  <text x="18" y="950.52" class="side">teams. Write to roystonad2004@gmail.com.</text>
  <rect x="18" y="985.52" width="304" height="1" fill="#1b1a17" opacity=".3"/>
  <text x="18" y="1009.52" class="section">On the workbench</text>
  <text x="18" y="1041.52" class="repo">roystonakashdsouza.in</text>
  <circle cx="22" cy="1059.52" r="4" fill="#3178c6"/>
  <text x="32" y="1064.52" class="meta">TypeScript  ·  today</text>
  <text x="18" y="1087.52" class="side">No description on file. Our reporters are</text>
  <text x="18" y="1108.52" class="side">investigating.</text>
  <text x="18" y="1155.52" class="repo">Raomly</text>
  <circle cx="22" cy="1173.52" r="4" fill="#3178c6"/>
  <text x="32" y="1178.52" class="meta">TypeScript  ·  3 days ago</text>
  <text x="18" y="1201.52" class="side">No description on file. Our reporters are</text>
  <text x="18" y="1222.52" class="side">investigating.</text>
  <text x="18" y="1269.52" class="repo">Lisi-re-Luxury</text>
  <circle cx="22" cy="1287.52" r="4" fill="#3178c6"/>
  <text x="32" y="1292.52" class="meta">TypeScript  ·  7 days ago</text>
  <text x="18" y="1315.52" class="side">Lisière-Luxury built using the capabilities</text>
  <text x="18" y="1336.52" class="side">of agentic ai </text>
  <rect x="0" y="1369.52" width="340" height="34" fill="#1b1a17"/>
  <svg x="0" y="1369.52" width="340" height="34"><g class="ticker" style="animation-duration:20s">
    <text x="0" y="22" class="tick" xml:space="preserve">COMMITS THIS WEEK 7 ▼ 22%    ◆    PUBLIC REPOS 64    ◆    STARS ★ 13    ◆    FOLLOWERS 18    ◆    </text>
    <text x="790" y="22" class="tick" xml:space="preserve">COMMITS THIS WEEK 7 ▼ 22%    ◆    PUBLIC REPOS 64    ◆    STARS ★ 13    ◆    FOLLOWERS 18    ◆    </text>
  </g></svg>
</svg>
