<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 360 1401.52" width="360" height="1401.52" role="img" aria-label="The Daily Royston — RAOMLY SEES 3 NEW COMMITs IN BUSY WEEK">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .04"/></feComponentTransfer>
    </filter>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity=".3"/></filter>
  </defs>
  <style>
    text { fill: #1b1a17; }
    .mast { font: 700 34px Georgia, 'Times New Roman', Times, serif; letter-spacing: -1px; }
    .motto { font: italic 400 15px Georgia, 'Times New Roman', Times, serif; fill: #5e5a51; }
    .edition { font: 700 12px Georgia, 'Times New Roman', Times, serif; letter-spacing: 1.2px; }
    .head { font: 700 25px Georgia, 'Times New Roman', Times, serif; letter-spacing: -.3px; }
    .deck { font: italic 400 16px Georgia, 'Times New Roman', Times, serif; fill: #34312b; }
    .byline { font: italic 400 14px Georgia, 'Times New Roman', Times, serif; fill: #5e5a51; }
    .body { font: 400 15px Georgia, 'Times New Roman', Times, serif; }
    .dropcap { font-weight: 700; font-family: Georgia, 'Times New Roman', Times, serif; }
    .section { font: 700 16px Georgia, 'Times New Roman', Times, serif; }
    .note { font: italic 400 13px Georgia, 'Times New Roman', Times, serif; fill: #5e5a51; }
    .row { font: 400 15px Georgia, 'Times New Roman', Times, serif; }
    .num { font-weight: 700; font-variant-numeric: tabular-nums; }
    .side { font: 400 14px Georgia, 'Times New Roman', Times, serif; fill: #2b2924; }
    .repo { font: 700 18px Georgia, 'Times New Roman', Times, serif; }
    .meta { font: 400 13px Georgia, 'Times New Roman', Times, serif; fill: #5e5a51; }
    .tick { font: 700 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f5f0e4; letter-spacing: .4px; }
    .ticker { animation: tick linear infinite; }
    @keyframes tick { to { transform: translateX(-790px); } }
    .live { animation: live 1.6s ease-in-out infinite; }
    @keyframes live { 50% { opacity: .15; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="340" height="1381.52" fill="#f5f0e4" filter="url(#shadow)"/>
  <rect width="340" height="1381.52" filter="url(#grain)"/>
  <text x="170" y="44.519999999999996" class="mast" text-anchor="middle" textLength="304" lengthAdjust="spacingAndGlyphs">The Daily Royston</text>
  <text x="170" y="70.52" class="motto" text-anchor="middle">“All the code that’s fit to ship.”</text>
  <rect x="18" y="88.52" width="304" height="1" fill="#1b1a17"/>
  <text x="170" y="108.52" class="edition" text-anchor="middle">NOV 1, 2026  ·  VOL. V  ·  NO. 1,465</text>
  <rect x="18" y="118.52" width="304" height="3" fill="#1b1a17"/><rect x="18" y="123.52" width="304" height="1" fill="#1b1a17"/>
  <text x="18" y="165.51999999999998" class="head">RAOMLY SEES 3 NEW</text>
  <text x="18" y="195.51999999999998" class="head">COMMITs IN BUSY</text>
  <text x="18" y="225.51999999999998" class="head">WEEK</text>
  <text x="18" y="255.51999999999998" class="deck">Latest dispatch from</text>
  <text x="18" y="277.52" class="deck">roystonakashdsouza.in reads “Merge pull</text>
  <text x="18" y="299.52" class="deck">request #1 from roystondz/redesign-v4”.</text>
  <text x="18" y="321.52" class="deck">Experts say more is on the way.</text>
  <rect x="18" y="351.52" width="304" height="1" fill="#1b1a17" opacity=".3"/>
  <text x="18" y="381.52" class="byline">By our GitHub correspondent  ·  1 Nov, 06:41 UTC</text>
  <text x="16" y="458.52" class="dropcap" style="font-size:81px">R</text>
  <text x="88" y="412.52" class="body">oyston Akash Dsouza, the</text>
  <text x="88" y="435.52" class="body">full-stack developer behind</text>
  <text x="88" y="458.52" class="body">roystonakashdsouza.in, Raomly</text>
  <text x="18" y="481.52" class="body">and Lisi-re-Luxury, logged 5 commits</text>
  <text x="18" y="504.52" class="body">this week across 2 repositories, down</text>
  <text x="18" y="527.52" class="body">55% on the week before.</text>
  <text x="18" y="556.52" class="body">When reached for comment, Dsouza said</text>
  <text x="18" y="579.52" class="body">only that the project was “one more</text>
  <text x="18" y="602.52" class="body">refactor away” from done. Readers hoping</text>
  <text x="18" y="625.52" class="body">to collaborate are directed to the</text>
  <text x="18" y="648.52" class="body">classifieds.</text>
  <rect x="18" y="675.52" width="304" height="1" fill="#1b1a17" opacity=".3"/>
  <text x="18" y="699.52" class="section">Markets</text>
  <text x="322" y="699.52" class="note" text-anchor="end">share · vs last wk</text>
  <text x="18" y="727.52" class="row">TypeScript</text>
  <text x="256" y="727.52" class="row num" text-anchor="end">100%</text>
  <text x="322" y="727.52" class="row num" text-anchor="end" fill="#1e6b3a">▲ 36</text>
  <rect x="18" y="759.52" width="304" height="1" fill="#1b1a17" opacity=".3"/>
  <text x="18" y="783.52" class="section">Forecast</text>
  <text x="18" y="809.52" class="side">100% chance of TypeScript. Clear skies</text>
  <text x="18" y="830.52" class="side">through the weekend.</text>
  <rect x="18" y="857.52" width="304" height="1" fill="#1b1a17" opacity=".3"/>
  <text x="18" y="881.52" class="section">Classifieds</text>
  <text x="18" y="907.52" class="side">Wanted: interesting problems and ambitious</text>
  <text x="18" y="928.52" class="side">teams. Write to roystonad2004@gmail.com.</text>
  <rect x="18" y="963.52" width="304" height="1" fill="#1b1a17" opacity=".3"/>
  <text x="18" y="987.52" class="section">On the workbench</text>
  <text x="18" y="1019.52" class="repo">roystonakashdsouza.in</text>
  <circle cx="22" cy="1037.52" r="4" fill="#3178c6"/>
  <text x="32" y="1042.52" class="meta">TypeScript  ·  2 days ago</text>
  <text x="18" y="1065.52" class="side">No description on file. Our reporters are</text>
  <text x="18" y="1086.52" class="side">investigating.</text>
  <text x="18" y="1133.52" class="repo">Raomly</text>
  <circle cx="22" cy="1151.52" r="4" fill="#3178c6"/>
  <text x="32" y="1156.52" class="meta">TypeScript  ·  5 days ago</text>
  <text x="18" y="1179.52" class="side">No description on file. Our reporters are</text>
  <text x="18" y="1200.52" class="side">investigating.</text>
  <text x="18" y="1247.52" class="repo">Lisi-re-Luxury</text>
  <circle cx="22" cy="1265.52" r="4" fill="#3178c6"/>
  <text x="32" y="1270.52" class="meta">TypeScript  ·  9 days ago</text>
  <text x="18" y="1293.52" class="side">Lisière-Luxury built using the capabilities</text>
  <text x="18" y="1314.52" class="side">of agentic ai </text>
  <rect x="0" y="1347.52" width="340" height="34" fill="#1b1a17"/>
  <svg x="0" y="1347.52" width="340" height="34"><g class="ticker" style="animation-duration:20s">
    <text x="0" y="22" class="tick" xml:space="preserve">COMMITS THIS WEEK 5 ▼ 55%    ◆    PUBLIC REPOS 64    ◆    STARS ★ 13    ◆    FOLLOWERS 18    ◆    </text>
    <text x="790" y="22" class="tick" xml:space="preserve">COMMITS THIS WEEK 5 ▼ 55%    ◆    PUBLIC REPOS 64    ◆    STARS ★ 13    ◆    FOLLOWERS 18    ◆    </text>
