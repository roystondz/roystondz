<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 957.9200000000001" width="730" height="957.9200000000001" role="img" aria-label="The Daily Royston — COMMITS SURGE 300% AS WORK ON RAOMLY ACCELERATES">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .04"/></feComponentTransfer>
    </filter>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity=".3"/></filter>
  </defs>
  <style>
    text { fill: #1b1a17; }
    .mast { font: 700 64px Georgia, 'Times New Roman', Times, serif; letter-spacing: -1px; }
    .motto { font: italic 400 15px Georgia, 'Times New Roman', Times, serif; fill: #5e5a51; }
    .edition { font: 700 12px Georgia, 'Times New Roman', Times, serif; letter-spacing: 1.2px; }
    .head { font: 700 36px Georgia, 'Times New Roman', Times, serif; letter-spacing: -.3px; }
    .deck { font: italic 400 18px Georgia, 'Times New Roman', Times, serif; fill: #34312b; }
    .byline { font: italic 400 14px Georgia, 'Times New Roman', Times, serif; fill: #5e5a51; }
    .body { font: 400 16px Georgia, 'Times New Roman', Times, serif; }
    .dropcap { font-weight: 700; font-family: Georgia, 'Times New Roman', Times, serif; }
    .section { font: 700 16px Georgia, 'Times New Roman', Times, serif; }
    .note { font: italic 400 13px Georgia, 'Times New Roman', Times, serif; fill: #5e5a51; }
    .row { font: 400 15px Georgia, 'Times New Roman', Times, serif; }
    .num { font-weight: 700; font-variant-numeric: tabular-nums; }
    .side { font: 400 14px Georgia, 'Times New Roman', Times, serif; fill: #2b2924; }
    .repo { font: 700 18px Georgia, 'Times New Roman', Times, serif; }
    .meta { font: 400 13px Georgia, 'Times New Roman', Times, serif; fill: #5e5a51; }
    .tick { font: 700 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f5f0e4; letter-spacing: .4px; }
    .ticker { animation: tick linear infinite; }
    @keyframes tick { to { transform: translateX(-1612px); } }
    .live { animation: live 1.6s ease-in-out infinite; }
    @keyframes live { 50% { opacity: .15; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="710" height="937.9200000000001" fill="#f5f0e4" filter="url(#shadow)"/>
  <rect width="710" height="937.9200000000001" filter="url(#grain)"/>
  <text x="355" y="81.92" class="mast" text-anchor="middle">The Daily Royston</text>
  <text x="355" y="107.92" class="motto" text-anchor="middle">“All the code that’s fit to ship.”</text>
  <rect x="32" y="125.92" width="646" height="1" fill="#1b1a17"/>
  <text x="32" y="145.92000000000002" class="edition">VOL. IV  ·  NO. 1,459</text>
  <text x="355" y="145.92000000000002" class="edition" text-anchor="middle">MONDAY, OCTOBER 26, 2026</text>
  <text x="664" y="145.92000000000002" class="edition" text-anchor="end">LATE EDITION</text><circle class="live" cx="674" cy="141.92000000000002" r="3.5" fill="#b3261e"/>
  <rect x="32" y="155.92000000000002" width="646" height="3" fill="#1b1a17"/><rect x="32" y="160.92000000000002" width="646" height="1" fill="#1b1a17"/>
  <text x="32" y="213.92000000000002" class="head">COMMITS SURGE 300% AS WORK</text>
  <text x="32" y="255.92000000000002" class="head">ON RAOMLY ACCELERATES</text>
  <text x="32" y="289.92" class="deck">Latest dispatch from Raomly reads “Fix typo that broke the saved stays</text>
  <text x="32" y="315.92" class="deck">import”. Experts say more is on the way.</text>
  <rect x="32" y="349.92" width="646" height="1" fill="#1b1a17" opacity=".3"/>
  <text x="32" y="379.92" class="byline">By our GitHub correspondent  ·  26 Oct, 05:10 UTC</text>
  <text x="30" y="462.92" class="dropcap" style="font-size:87px">R</text>
  <text x="107" y="412.92" class="body">oyston Akash Dsouza, the full-stack</text>
  <text x="107" y="437.92" class="body">developer behind Raomly, Lisi-re-Luxury</text>
  <text x="107" y="462.92" class="body">and mcp-server, logged 12 commits this</text>
  <text x="32" y="487.92" class="body">week across 3 repositories.</text>
  <text x="32" y="518.9200000000001" class="body">When reached for comment, Dsouza said only that the</text>
  <text x="32" y="543.9200000000001" class="body">project was “one more refactor away” from done.</text>
  <text x="32" y="568.9200000000001" class="body">Readers hoping to collaborate are directed to the</text>
  <text x="32" y="593.9200000000001" class="body">classifieds.</text>
  <rect x="478" y="349.92" width="200" height="1" fill="#1b1a17" opacity=".3"/>
  <text x="478" y="373.92" class="section">Markets</text>
  <text x="678" y="373.92" class="note" text-anchor="end">share · vs last wk</text>
  <text x="478" y="401.92" class="row">TypeScript</text>
  <text x="612" y="401.92" class="row num" text-anchor="end">75%</text>
  <text x="678" y="401.92" class="row num" text-anchor="end" fill="#1e6b3a">▲ 75</text>
  <text x="478" y="427.92" class="row">Python</text>
  <text x="612" y="427.92" class="row num" text-anchor="end">25%</text>
  <text x="678" y="427.92" class="row num" text-anchor="end" fill="#b3261e">▼ 8</text>
  <rect x="478" y="459.92" width="200" height="1" fill="#1b1a17" opacity=".3"/>
  <text x="478" y="483.92" class="section">Forecast</text>
  <text x="478" y="509.92" class="side">75% chance of TypeScript,</text>
  <text x="478" y="530.9200000000001" class="side">with scattered Python</text>
  <text x="478" y="551.9200000000001" class="side">showers clearing ahead of</text>
  <text x="478" y="572.9200000000001" class="side">the Friday deploy.</text>
  <rect x="478" y="599.9200000000001" width="200" height="1" fill="#1b1a17" opacity=".3"/>
  <text x="478" y="623.9200000000001" class="section">Classifieds</text>
  <text x="478" y="649.9200000000001" class="side">Wanted: interesting problems</text>
  <text x="478" y="670.9200000000001" class="side">and ambitious teams. Write</text>
  <text x="478" y="691.9200000000001" class="side">to roystonad2004@gmail.com.</text>
  <rect x="32" y="726.9200000000001" width="646" height="1" fill="#1b1a17" opacity=".3"/>
  <text x="32" y="750.9200000000001" class="section">On the workbench</text>
  <text x="32" y="782.9200000000001" class="repo">Raomly</text>
  <circle cx="36" cy="800.9200000000001" r="4" fill="#3178c6"/>
  <text x="46" y="805.9200000000001" class="meta">TypeScript  ·  today</text>
  <text x="32" y="828.9200000000001" class="side">No description on file. Our</text>
  <text x="32" y="849.9200000000001" class="side">reporters are investigating.</text>
  <text x="256" y="782.9200000000001" class="repo">Lisi-re-Luxury</text>
  <circle cx="260" cy="800.9200000000001" r="4" fill="#3178c6"/>
  <text x="270" y="805.9200000000001" class="meta">TypeScript  ·  3 days ago</text>
  <text x="256" y="828.9200000000001" class="side">Lisière-Luxury built using</text>
  <text x="256" y="849.9200000000001" class="side">the capabilities of agentic</text>
  <text x="256" y="870.9200000000001" class="side">ai </text>
  <text x="480" y="782.9200000000001" class="repo">mcp-server</text>
  <circle cx="484" cy="800.9200000000001" r="4" fill="#3572a5"/>
  <text x="494" y="805.9200000000001" class="meta">Python  ·  5 days ago</text>
  <text x="480" y="828.9200000000001" class="side">No description on file. Our</text>
  <text x="480" y="849.9200000000001" class="side">reporters are investigating.</text>
  <rect x="0" y="903.9200000000001" width="710" height="34" fill="#1b1a17"/>
  <svg x="0" y="903.9200000000001" width="710" height="34"><g class="ticker" style="animation-duration:40s">
    <text x="0" y="22" class="tick" xml:space="preserve">COMMITS THIS WEEK 12 ▲ 300%    ◆    PUBLIC REPOS 64    ◆    STARS ★ 13    ◆    FOLLOWERS 18    ◆    COMMITS THIS WEEK 12 ▲ 300%    ◆    PUBLIC REPOS 64    ◆    STARS ★ 13    ◆    FOLLOWERS 18    ◆    </text>
    <text x="1612" y="22" class="tick" xml:space="preserve">COMMITS THIS WEEK 12 ▲ 300%    ◆    PUBLIC REPOS 64    ◆    STARS ★ 13    ◆    FOLLOWERS 18    ◆    COMMITS THIS WEEK 12 ▲ 300%    ◆    PUBLIC REPOS 64    ◆    STARS ★ 13    ◆    FOLLOWERS 18    ◆    </text>
