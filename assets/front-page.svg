  <text x="678" y="399.92" class="note" text-anchor="end">share · vs last wk</text>
  <text x="478" y="427.92" class="row">TypeScript</text>
  <text x="612" y="427.92" class="row num" text-anchor="end">100%</text>
  <text x="678" y="427.92" class="row num" text-anchor="end" fill="#1e6b3a">▲ 44</text>
  <rect x="478" y="459.92" width="200" height="1" fill="#1b1a17" opacity=".3"/>
  <text x="478" y="483.92" class="section">Forecast</text>
  <text x="478" y="509.92" class="side">100% chance of TypeScript.</text>
  <text x="478" y="530.9200000000001" class="side">Clear skies through the</text>
  <text x="478" y="551.9200000000001" class="side">weekend.</text>
  <rect x="478" y="578.9200000000001" width="200" height="1" fill="#1b1a17" opacity=".3"/>
  <text x="478" y="602.9200000000001" class="section">Classifieds</text>
  <text x="478" y="628.9200000000001" class="side">Wanted: interesting problems</text>
  <text x="478" y="649.9200000000001" class="side">and ambitious teams. Write</text>
  <text x="478" y="670.9200000000001" class="side">to roystonad2004@gmail.com.</text>
  <rect x="32" y="705.9200000000001" width="646" height="1" fill="#1b1a17" opacity=".3"/>
