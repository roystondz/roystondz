  <text x="32" y="213.92000000000002" class="head">DEVELOPER SPOTTED SHIPPING</text>
  <text x="32" y="255.92000000000002" class="head">5 COMMITs TO RAOMLY</text>
  <text x="32" y="289.92" class="deck">Latest dispatch from roystonakashdsouza.in reads “Merge pull request #1 from</text>
  <text x="32" y="315.92" class="deck">roystondz/redesign-v4”. Sources close to the developer call it “a step in the</text>
  <text x="32" y="341.92" class="deck">right direction.”</text>
  <rect x="32" y="375.92" width="646" height="1" fill="#1b1a17" opacity=".3"/>
  <text x="32" y="405.92" class="byline">By our GitHub correspondent  ·  30 Oct, 06:18 UTC</text>
  <text x="30" y="488.92" class="dropcap" style="font-size:87px">R</text>
  <text x="107" y="438.92" class="body">oyston Akash Dsouza, the full-stack</text>
  <text x="107" y="463.92" class="body">developer behind roystonakashdsouza.in,</text>
  <text x="107" y="488.92" class="body">Raomly and Lisi-re-Luxury, logged 7</text>
  <text x="32" y="513.9200000000001" class="body">commits this week across 2 repositories, down 22% on</text>
  <text x="32" y="538.9200000000001" class="body">the week before.</text>
  <text x="32" y="569.9200000000001" class="body">When reached for comment, Dsouza said only that the</text>
  <text x="32" y="594.9200000000001" class="body">project was “one more refactor away” from done.</text>
  <text x="32" y="619.9200000000001" class="body">Readers hoping to collaborate are directed to the</text>
  <text x="32" y="644.9200000000001" class="body">classifieds.</text>
  <rect x="478" y="375.92" width="200" height="1" fill="#1b1a17" opacity=".3"/>
